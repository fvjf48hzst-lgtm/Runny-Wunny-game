<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Neon Light Cycles</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #02040d;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action: none;
}

body {

    display: flex;

    justify-content: center;

    align-items: center;
}

#gameWrap {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #02040d;
}

canvas {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    touch-action: none;
}


/* ================================
   HUD
================================ */

#hud {

    position: absolute;

    top: 15px;
    left: 0;

    width: 100%;

    padding: 0 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: white;

    font-weight: bold;

    font-size: 16px;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #00eaff;

    pointer-events: none;

    z-index: 10;
}


/* ================================
   PAUSE BUTTON
================================ */

#pauseButton {

    position: absolute;

    right: 18px;
    top: 50px;

    width: 48px;
    height: 48px;

    border: 2px solid #00eaff;

    border-radius: 10px;

    background:
        rgba(0, 10, 25, .75);

    color: white;

    font-size: 21px;

    font-weight: bold;

    box-shadow:
        0 0 10px #00eaff;

    z-index: 30;

    touch-action: manipulation;
}


/* ================================
   MOBILE CONTROLS
================================ */

#mobileControls {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 25px;

    display: flex;

    justify-content:
        space-between;

    padding:
        0 25px;

    pointer-events: none;

    z-index: 20;
}

.turnButton {

    width: 85px;
    height: 85px;

    border-radius: 18px;

    border:
        3px solid #00eaff;

    background:
        rgba(0, 15, 35, .7);

    color: #00eaff;

    font-size: 36px;

    font-weight: bold;

    box-shadow:
        0 0 15px #00eaff,
        inset 0 0 15px
        rgba(0,234,255,.2);

    pointer-events: auto;

    user-select: none;

    -webkit-user-select: none;

    touch-action: none;
}

.turnButton:active {

    transform: scale(.92);

    background:
        rgba(0,234,255,.3);
}

#leftButton {

    border-color:
        #00eaff;

    color:
        #00eaff;
}

#rightButton {

    border-color:
        #ff2bd6;

    color:
        #ff2bd6;

    box-shadow:
        0 0 15px #ff2bd6,
        inset 0 0 15px
        rgba(255,43,214,.2);
}


/* ================================
   MENUS
================================ */

.menu {

    position: absolute;

    inset: 0;

    display: none;

    justify-content: center;

    align-items: center;

    background:
        rgba(0,0,10,.78);

    z-index: 50;
}

.menuBox {

    width:
        min(440px, 88vw);

    padding: 32px;

    text-align: center;

    color: white;

    border:
        2px solid #00eaff;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #07142e,
            #020711
        );

    box-shadow:
        0 0 20px #00eaff,
        inset 0 0 30px
        rgba(0,234,255,.08);
}

.menuBox h1 {

    margin:
        0 0 12px;

    font-size:
        clamp(32px, 8vw, 52px);

    color:
        #00eaff;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.menuBox p {

    color:
        #d9faff;

    line-height:
        1.5;

    margin:
        10px 0 25px;
}

.menuButton {

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border:
        2px solid #00eaff;

    border-radius: 10px;

    background:
        #071f3d;

    color: white;

    font-size: 17px;

    font-weight: bold;

    box-shadow:
        0 0 10px
        rgba(0,234,255,.4);

    touch-action:
        manipulation;
}

.menuButton:active {

    transform:
        scale(.97);

    background:
        #0d3c68;
}


/* ================================
   TITLE SCREEN
================================ */

#startMenu {

    display: flex;
}


/* ================================
   SMALL SCREENS
================================ */

@media(max-width:600px) {

    .turnButton {

        width: 72px;
        height: 72px;

        font-size: 30px;
    }

    #mobileControls {

        padding:
            0 15px;

        bottom: 15px;
    }

    #hud {

        font-size: 14px;
    }
}

</style>
</head>


<body>

<div id="gameWrap">

<canvas id="game"></canvas>


<div id="hud">

    <div id="scoreText">
        SCORE: 0
    </div>

    <div id="aliveText">
        RIDERS: 4
    </div>

</div>


<button id="pauseButton">
    Ⅱ
</button>


<!-- MOBILE CONTROLS -->

<div id="mobileControls">

    <button
        class="turnButton"
        id="leftButton">
        ◀
    </button>

    <button
        class="turnButton"
        id="rightButton">
        ▶
    </button>

</div>


<!-- START MENU -->

<div
    class="menu"
    id="startMenu">

    <div class="menuBox">

        <h1>
            NEON<br>
            CYCLES
        </h1>

        <p>
            Drive through the arena,
            leave a glowing trail,
            and force the other riders
            to crash.
        </p>

        <button
            class="menuButton"
            id="startButton">

            START

        </button>

    </div>

</div>


<!-- PAUSE MENU -->

<div
    class="menu"
    id="pauseMenu">

    <div class="menuBox">

        <h1>
            PAUSED
        </h1>

        <button
            class="menuButton"
            id="resumeButton">

            RESUME

        </button>

        <button
            class="menuButton"
            id="restartButton">

            RESTART

        </button>

    </div>

</div>


<!-- DEATH MENU -->

<div
    class="menu"
    id="deathMenu">

    <div class="menuBox">

        <h1>
            CRASHED
        </h1>

        <p id="deathMessage">
            Your cycle crashed.
        </p>

        <button
            class="menuButton"
            id="retryButton">

            TRY AGAIN

        </button>

    </div>

</div>


<!-- WIN MENU -->

<div
    class="menu"
    id="winMenu">

    <div class="menuBox">

        <h1>
            VICTORY
        </h1>

        <p>
            You were the last rider
            standing.
        </p>

        <button
            class="menuButton"
            id="playAgainButton">

            PLAY AGAIN

        </button>

    </div>

</div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let W = 1280;
let H = 720;


function resize() {

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W;

    canvas.height =
        H;

    arena.width =
        W;

    arena.height =
        H;

}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   GAME SETTINGS
========================================================= */

const BASE_SPEED = 4.8;

const TURN_SPEED =
    Math.PI / 2;

const TRAIL_SPACING = 5;

const ARENA_MARGIN = 45;

const AI_COUNT = 3;


let gameState = "menu";

let score = 0;

let elapsed = 0;

let shake = 0;


/* =========================================================
   ARENA
========================================================= */

const arena = {

    width: W,

    height: H

};


/* =========================================================
   RIDERS
========================================================= */

let riders = [];


/* =========================================================
   PARTICLES
========================================================= */

let particles = [];


/* =========================================================
   COLORS
========================================================= */

const colors = {

    player: "#00eaff",

    ai1: "#ff2bd6",

    ai2: "#ffe600",

    ai3: "#8b5cff"

};


/* =========================================================
   CREATE PLAYER
========================================================= */

function createPlayer() {

    return {

        x: W * .25,

        y: H * .5,

        angle: 0,

        speed: BASE_SPEED,

        color: colors.player,

        alive: true,

        trail: [],

        lastTrailX:
            W * .25,

        lastTrailY:
            H * .5,

        turnLeft: false,

        turnRight: false,

        ai: false,

        aiTimer: 0,

        targetTurn: 0

    };

}


/* =========================================================
   CREATE AI
========================================================= */

function createAI(
    x,
    y,
    angle,
    color
) {

    return {

        x,

        y,

        angle,

        speed:
            BASE_SPEED,

        color,

        alive: true,

        trail: [],

        lastTrailX: x,

        lastTrailY: y,

        turnLeft: false,

        turnRight: false,

        ai: true,

        aiTimer:
            Math.random() * 100,

        targetTurn: 0

    };

}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    riders = [];

    particles = [];

    elapsed = 0;

    score = 0;

    shake = 0;


    /* player */

    riders.push(
        createPlayer()
    );


    /* AI */

    riders.push(
        createAI(
            W * .72,
            H * .25,
            Math.PI,
            colors.ai1
        )
    );


    riders.push(
        createAI(
            W * .72,
            H * .75,
            Math.PI,
            colors.ai2
        )
    );


    riders.push(
        createAI(
            W * .50,
            H * .25,
            Math.PI / 2,
            colors.ai3
        )
    );


    /* initial trail */

    for (const rider of riders) {

        rider.trail.push({

            x: rider.x,

            y: rider.y

        });

    }


    updateHUD();

}


/* =========================================================
   START
========================================================= */

function startGame() {

    resetGame();

    gameState =
        "playing";

    hideMenus();

}


/* =========================================================
   MENUS
========================================================= */

const startMenu =
    document.getElementById(
        "startMenu"
    );

const pauseMenu =
    document.getElementById(
        "pauseMenu"
    );

const deathMenu =
    document.getElementById(
        "deathMenu"
    );

const winMenu =
    document.getElementById(
        "winMenu"
    );


function hideMenus() {

    startMenu.style.display =
        "none";

    pauseMenu.style.display =
        "none";

    deathMenu.style.display =
        "none";

    winMenu.style.display =
        "none";

}


document.getElementById(
    "startButton"
).onclick =
    startGame;


document.getElementById(
    "retryButton"
).onclick =
    startGame;


document.getElementById(
    "playAgainButton"
).onclick =
    startGame;


document.getElementById(
    "restartButton"
).onclick =
    startGame;


document.getElementById(
    "resumeButton"
).onclick =
    () => {

        gameState =
            "playing";

        pauseMenu.style.display =
            "none";

    };


document.getElementById(
    "pauseButton"
).onclick =
    togglePause;


function togglePause() {

    if (
        gameState === "playing"
    ) {

        gameState =
            "paused";

        pauseMenu.style.display =
            "flex";

    }

    else if (
        gameState === "paused"
    ) {

        gameState =
            "playing";

        pauseMenu.style.display =
            "none";

    }

}


/* =========================================================
   INPUT
========================================================= */

const leftButton =
    document.getElementById(
        "leftButton"
    );

const rightButton =
    document.getElementById(
        "rightButton"
    );


function leftDown(e) {

    e.preventDefault();

    if (
        riders[0]
    ) {

        riders[0].turnLeft =
            true;

    }

}


function leftUp(e) {

    e.preventDefault();

    if (
        riders[0]
    ) {

        riders[0].turnLeft =
            false;

    }

}


function rightDown(e) {

    e.preventDefault();

    if (
        riders[0]
    ) {

        riders[0].turnRight =
            true;

    }

}


function rightUp(e) {

    e.preventDefault();

    if (
        riders[0]
    ) {

        riders[0].turnRight =
            false;

    }

}


leftButton.addEventListener(
    "pointerdown",
    leftDown
);

leftButton.addEventListener(
    "pointerup",
    leftUp
);

leftButton.addEventListener(
    "pointercancel",
    leftUp
);

leftButton.addEventListener(
    "pointerleave",
    leftUp
);


rightButton.addEventListener(
    "pointerdown",
    rightDown
);

rightButton.addEventListener(
    "pointerup",
    rightUp
);

rightButton.addEventListener(
    "pointercancel",
    rightUp
);

rightButton.addEventListener(
    "pointerleave",
    rightUp
);


/* keyboard */

document.addEventListener(
    "keydown",
    e => {

        if (
            !riders[0]
        ) return;


        if (
            e.code ===
            "ArrowLeft"
        ) {

            riders[0].turnLeft =
                true;

        }


        if (
            e.code ===
            "ArrowRight"
        ) {

            riders[0].turnRight =
                true;

        }


        if (
            e.code ===
            "KeyA"
        ) {

            riders[0].turnLeft =
                true;

        }


        if (
            e.code ===
            "KeyD"
        ) {

            riders[0].turnRight =
                true;

        }


        if (
            e.code ===
            "KeyP" ||
            e.code ===
            "Escape"
        ) {

            togglePause();

        }

    }
);


document.addEventListener(
    "keyup",
    e => {

        if (
            !riders[0]
        ) return;


        if (
            e.code ===
            "ArrowLeft" ||
            e.code ===
            "KeyA"
        ) {

            riders[0].turnLeft =
                false;

        }


        if (
            e.code ===
            "ArrowRight" ||
            e.code ===
            "KeyD"
        ) {

            riders[0].turnRight =
                false;

        }

    }
);


/* =========================================================
   PLAYER TURNING
========================================================= */

function updatePlayer(
    rider,
    dt
) {

    if (
        rider.turnLeft
    ) {

        rider.angle -=
            TURN_SPEED * dt;

    }


    if (
        rider.turnRight
    ) {

        rider.angle +=
            TURN_SPEED * dt;

    }

}


/* =========================================================
   AI
========================================================= */

function updateAI(
    rider,
    dt
) {

    rider.aiTimer -= dt;


    if (
        rider.aiTimer <= 0
    ) {

        rider.aiTimer =
            20 + Math.random() * 80;


        const danger =
            checkDangerAhead(
                rider,
                90
            );


        if (danger) {

            if (
                Math.random() < .5
            ) {

                rider.targetTurn =
                    -1;

            }

            else {

                rider.targetTurn =
                    1;

            }

        }

        else {

            if (
                Math.random() < .35
            ) {

                rider.targetTurn =
                    Math.random() <
                    .5
                        ? -1
                        : 1;

            }

            else {

                rider.targetTurn =
                    0;

            }

        }

    }


    if (
        rider.targetTurn < 0
    ) {

        rider.angle -=
            TURN_SPEED * dt;

    }

    if (
        rider.targetTurn > 0
    ) {

        rider.angle +=
            TURN_SPEED * dt;

    }

}


/* =========================================================
   DANGER CHECK
========================================================= */

function checkDangerAhead(
    rider,
    distance
) {

    const testX =
        rider.x +
        Math.cos(
            rider.angle
        ) * distance;

    const testY =
        rider.y +
        Math.sin(
            rider.angle
        ) * distance;


    if (
        testX <
        ARENA_MARGIN + 15
    ) return true;


    if (
        testX >
        W -
        ARENA_MARGIN -
        15
    ) return true;


    if (
        testY <
        ARENA_MARGIN + 15
    ) return true;


    if (
        testY >
        H -
        ARENA_MARGIN -
        15
    ) return true;


    for (
        const other of riders
    ) {

        for (
            let i =
                Math.max(
                    0,
                    other.trail.length -
                    80
                );

            i <
                other.trail.length;

            i++
        ) {

            const point =
                other.trail[i];

            const dx =
                point.x -
                testX;

            const dy =
                point.y -
                testY;

            if (
                Math.sqrt(
                    dx * dx +
                    dy * dy
                ) < 18
            ) {

                return true;

            }

        }

    }


    return false;

}


/* =========================================================
   MOVE RIDER
========================================================= */

function moveRider(
    rider,
    dt
) {

    rider.x +=
        Math.cos(
            rider.angle
        ) *
        rider.speed *
        dt;

    rider.y +=
        Math.sin(
            rider.angle
        ) *
        rider.speed *
        dt;


    /* trail */

    const dx =
        rider.x -
        rider.lastTrailX;

    const dy =
        rider.y -
        rider.lastTrailY;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance >=
        TRAIL_SPACING
    ) {

        rider.trail.push({

            x: rider.x,

            y: rider.y

        });

        rider.lastTrailX =
            rider.x;

        rider.lastTrailY =
            rider.y;

    }


    /* speed slowly increases */

    rider.speed =
        Math.min(
            8,
            BASE_SPEED +
            elapsed * .002
        );

}


/* =========================================================
   COLLISION
========================================================= */

function checkCollision(
    rider
) {

    /* arena walls */

    if (
        rider.x <
        ARENA_MARGIN
    ) {

        return true;

    }


    if (
        rider.x >
        W -
        ARENA_MARGIN
    ) {

        return true;

    }


    if (
        rider.y <
        ARENA_MARGIN
    ) {

        return true;

    }


    if (
        rider.y >
        H -
        ARENA_MARGIN
    ) {

        return true;

    }


    /* trails */

    for (
        const other of riders
    ) {

        for (
            let i = 0;
            i <
            other.trail.length;
            i++
        ) {

            const point =
                other.trail[i];


            /* ignore extremely recent
               trail points of yourself */

            if (
                other === rider &&
                i >
                other.trail.length -
                12
            ) {

                continue;

            }


            const dx =
                point.x -
                rider.x;

            const dy =
                point.y -
                rider.y;


            if (
                dx * dx +
                dy * dy <
                12 * 12
            ) {

                return true;

            }

        }

    }


    return false;

}


/* =========================================================
   CRASH
========================================================= */

function crash(
    rider
) {

    if (
        !rider.alive
    ) return;


    rider.alive =
        false;


    createExplosion(
        rider.x,
        rider.y,
        rider.color
    );


    shake = 12;


    if (
        rider === riders[0]
    ) {

        gameState =
            "dead";


        document.getElementById(
            "deathMessage"
        ).textContent =
            "Your cycle crashed. Score: " +
            score;


        setTimeout(
            () => {

                if (
                    gameState ===
                    "dead"
                ) {

                    deathMenu.style.display =
                        "flex";

                }

            },
            650
        );

    }

}


/* =========================================================
   SCORE
========================================================= */

function updateScore() {

    const player =
        riders[0];

    if (
        !player
    ) return;


    score =
        Math.floor(
            elapsed * 10
        );

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticle(
    x,
    y,
    vx,
    vy,
    life,
    size,
    color
) {

    particles.push({

        x,
        y,

        vx,
        vy,

        life,

        maxLife:
            life,

        size,

        color

    });

}


function createExplosion(
    x,
    y,
    color
) {

    for (
        let i = 0;
        i < 50;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            Math.random() *
            7 +
            2;

        createParticle(

            x,
            y,

            Math.cos(angle) *
            speed,

            Math.sin(angle) *
            speed,

            30 +
            Math.random() *
            35,

            Math.random() <
                .7
                ? color
                : "#ffffff",

            Math.random() *
                6 +
                2

        );

    }

}


function updateParticles(
    dt
) {

    for (
        let i =
            particles.length -
            1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;


        p.vx *=
            .97;

        p.vy *=
            .97;


        p.life -= dt;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    updateParticles(dt);


    if (
        gameState !==
        "playing"
    ) {

        return;

    }


    elapsed += dt;


    const player =
        riders[0];


    /* player */

    if (
        player.alive
    ) {

        updatePlayer(
            player,
            dt
        );

        moveRider(
            player,
            dt
        );

    }


    /* AI */

    for (
        let i = 1;
        i < riders.length;
        i++
    ) {

        const rider =
            riders[i];


        if (
            !rider.alive
        ) continue;


        updateAI(
            rider,
            dt
        );

        moveRider(
            rider,
            dt
        );

    }


    /* collisions */

    for (
        const rider of riders
    ) {

        if (
            rider.alive &&
            checkCollision(rider)
        ) {

            crash(rider);

        }

    }


    /* score */

    updateScore();


    /* victory */

    const aliveRiders =
        riders.filter(
            r => r.alive
        );


    if (
        player.alive &&
        aliveRiders.length === 1
    ) {

        gameState =
            "won";


        createExplosion(
            player.x,
            player.y,
            player.color
        );


        setTimeout(
            () => {

                winMenu.style.display =
                    "flex";

            },
            500
        );

    }


    if (
        shake > 0
    ) {

        shake *= .9;

        if (
            shake < .1
        ) {

            shake = 0;

        }

    }


    updateHUD();

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    const gradient =
        ctx.createRadialGradient(
            W / 2,
            H / 2,
            50,
            W / 2,
            H / 2,
            Math.max(W, H)
        );


    gradient.addColorStop(
        0,
        "#091a3d"
    );

    gradient.addColorStop(
        1,
        "#01030a"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* grid */

    ctx.save();


    ctx.strokeStyle =
        "rgba(0,234,255,.09)";

    ctx.lineWidth = 1;


    const grid = 50;


    for (
        let x =
            -(
                elapsed *
                .5
            ) %
            grid;

        x < W;

        x += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();

    }


    for (
        let y = 0;

        y < H;

        y += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   ARENA BORDER
========================================================= */

function drawArena() {

    ctx.save();


    ctx.shadowBlur =
        25;

    ctx.shadowColor =
        "#00eaff";


    ctx.strokeStyle =
        "#00eaff";

    ctx.lineWidth =
        5;


    ctx.strokeRect(

        ARENA_MARGIN,

        ARENA_MARGIN,

        W -
            ARENA_MARGIN *
            2,

        H -
            ARENA_MARGIN *
            2

    );


    ctx.shadowBlur =
        0;


    ctx.strokeStyle =
        "rgba(0,234,255,.2)";

    ctx.lineWidth =
        15;


    ctx.strokeRect(

        ARENA_MARGIN,

        ARENA_MARGIN,

        W -
            ARENA_MARGIN *
            2,

        H -
            ARENA_MARGIN *
            2

    );


    ctx.restore();

}


/* =========================================================
   DRAW TRAILS
========================================================= */

function drawTrails() {

    for (
        const rider of riders
    ) {

        if (
            rider.trail.length <
            2
        ) continue;


        ctx.save();


        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";


        /* glow */

        ctx.shadowBlur =
            20;

        ctx.shadowColor =
            rider.color;

        ctx.strokeStyle =
            rider.color;

        ctx.lineWidth =
            7;


        ctx.beginPath();


        ctx.moveTo(

            rider.trail[0].x,

            rider.trail[0].y

        );


        for (
            let i = 1;
            i <
            rider.trail.length;
            i++
        ) {

            ctx.lineTo(

                rider.trail[i].x,

                rider.trail[i].y

            );

        }


        ctx.stroke();


        /* bright core */

        ctx.shadowBlur =
            0;

        ctx.strokeStyle =
            "#ffffff";

        ctx.globalAlpha =
            .8;

        ctx.lineWidth =
            2;


        ctx.beginPath();


        ctx.moveTo(

            rider.trail[0].x,

            rider.trail[0].y

        );


        for (
            let i = 1;
            i <
            rider.trail.length;
            i++
        ) {

            ctx.lineTo(

                rider.trail[i].x,

                rider.trail[i].y

            );

        }


        ctx.stroke();


        ctx.restore();

    }

}


/* =========================================================
   DRAW RIDERS
========================================================= */

function drawRiders() {

    for (
        const rider of riders
    ) {

        if (
            !rider.alive
        ) continue;


        ctx.save();


        ctx.translate(
            rider.x,
            rider.y
        );


        ctx.rotate(
            rider.angle
        );


        /* glow */

        ctx.shadowBlur =
            25;

        ctx.shadowColor =
            rider.color;


        /* main bike */

        ctx.fillStyle =
            rider.color;


        ctx.fillRect(
            -25,
            -11,
            50,
            22
        );


        /* body */

        ctx.fillStyle =
            "#07101e";


        ctx.fillRect(
            -12,
            -8,
            25,
            16
        );


        /* front */

        ctx.fillStyle =
            "#ffffff";


        ctx.fillRect(
            14,
            -5,
            8,
            10
        );


        /* wheels */

        ctx.fillStyle =
            rider.color;


        ctx.fillRect(
            -18,
            -15,
            9,
            5
        );


        ctx.fillRect(
            -18,
            10,
            9,
            5
        );


        ctx.restore();

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticles() {

    for (
        const p of particles
    ) {

        const alpha =
            Math.max(
                0,
                p.life /
                p.maxLife
            );


        ctx.globalAlpha =
            alpha;


        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            p.color;


        ctx.fillStyle =
            p.color;


        ctx.fillRect(

            p.x - p.size / 2,

            p.y - p.size / 2,

            p.size,

            p.size

        );

    }


    ctx.globalAlpha =
        1;

    ctx.shadowBlur =
        0;

}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    document.getElementById(
        "scoreText"
    ).textContent =
        "SCORE: " +
        score;


    const alive =
        riders.filter(
            r => r.alive
        ).length;


    document.getElementById(
        "aliveText"
    ).textContent =
        "RIDERS: " +
        alive;

}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    ctx.save();


    if (
        shake > 0
    ) {

        ctx.translate(

            (Math.random() -
                .5) *
                shake,

            (Math.random() -
                .5) *
                shake

        );

    }


    drawBackground();

    drawArena();

    drawTrails();

    drawRiders();

    drawParticles();


    ctx.restore();

}


/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime =
    performance.now();


function gameLoop(now) {

    let dt =
        (now -
            lastTime) /
        16.6667;


    lastTime =
        now;


    if (
        dt > 2
    ) {

        dt = 2;

    }


    update(dt);

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
========================================================= */

resize();

resetGame();

requestAnimationFrame(
    gameLoop
);

</script>

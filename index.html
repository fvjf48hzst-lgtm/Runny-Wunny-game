<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Cycles</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
            radial-gradient(circle at center, #001b35 0%, #000814 55%, #000000 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        touch-action: none;
        user-select: none;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #gameWrapper {
        position: relative;
        width: min(94vw, 700px);
        aspect-ratio: 1 / 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        width: 100%;
        height: 100%;
        display: block;
        background:
            linear-gradient(rgba(0, 100, 255, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 100, 255, 0.04) 1px, transparent 1px),
            radial-gradient(circle, #001a30 0%, #000814 70%);
        border: 2px solid #008cff;
        box-shadow:
            0 0 12px #008cff,
            inset 0 0 30px rgba(0, 110, 255, 0.25);
    }

    #pauseButton {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 20;
        width: 42px;
        height: 42px;
        border: 2px solid #00aaff;
        border-radius: 8px;
        background: rgba(0, 10, 25, 0.85);
        color: #00c8ff;
        font-size: 23px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
            0 0 10px #008cff,
            inset 0 0 8px rgba(0, 150, 255, 0.3);
    }

    #pauseMenu {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(0, 5, 15, 0.72);
        backdrop-filter: blur(4px);
    }

    #pauseBox {
        width: min(75%, 300px);
        padding: 28px;
        border: 2px solid #00aaff;
        border-radius: 14px;
        background: rgba(0, 12, 30, 0.95);
        box-shadow:
            0 0 25px #008cff,
            inset 0 0 20px rgba(0, 140, 255, 0.15);
        text-align: center;
    }

    #pauseBox h2 {
        margin: 0 0 22px;
        color: #00c8ff;
        text-shadow: 0 0 10px #008cff;
        letter-spacing: 3px;
    }

    .menuButton {
        width: 100%;
        margin: 8px 0;
        padding: 13px;
        border: 2px solid #008cff;
        border-radius: 8px;
        background: #001329;
        color: #00c8ff;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 0 8px rgba(0, 140, 255, 0.5);
    }

    #hud {
        position: absolute;
        top: 8px;
        left: 0;
        right: 0;
        z-index: 10;
        pointer-events: none;
        text-align: center;
    }

    #stopwatch {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 8px;
        background: rgba(0, 5, 15, 0.72);
        color: #ffffff;
        font-size: 17px;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 0 0 8px #ffffff;
    }

    #laserStatus {
        position: absolute;
        left: 12px;
        bottom: 10px;
        color: #00c8ff;
        font-size: 12px;
        font-weight: bold;
        text-shadow: 0 0 8px #00aaff;
    }

    #enemyStatus {
        position: absolute;
        right: 12px;
        bottom: 10px;
        color: #ff3333;
        font-size: 12px;
        font-weight: bold;
        text-shadow: 0 0 8px #ff0000;
    }

    #gameMessage {
        position: absolute;
        inset: 0;
        z-index: 15;
        display: none;
        justify-content: center;
        align-items: center;
        pointer-events: none;
    }

    #messageText {
        padding: 18px 25px;
        border: 2px solid #00c8ff;
        border-radius: 12px;
        background: rgba(0, 5, 15, 0.9);
        color: #ffffff;
        font-size: 26px;
        font-weight: bold;
        text-align: center;
        text-shadow: 0 0 12px #00aaff;
        box-shadow: 0 0 20px #008cff;
    }
</style>
</head>

<body>

<div id="gameWrapper">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div id="stopwatch">00:00.00</div>
    </div>

    <div id="pauseButton">Ⅱ</div>

    <div id="laserStatus">LASER OFF</div>
    <div id="enemyStatus">RED TRAIL ON</div>

    <div id="pauseMenu">
        <div id="pauseBox">
            <h2>PAUSED</h2>
            <button class="menuButton" id="resumeButton">RESUME</button>
            <button class="menuButton" id="restartButton">RESTART</button>
        </div>
    </div>

    <div id="gameMessage">
        <div id="messageText"></div>
    </div>

</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const pauseButton = document.getElementById("pauseButton");
const pauseMenu = document.getElementById("pauseMenu");
const resumeButton = document.getElementById("resumeButton");
const restartButton = document.getElementById("restartButton");

const stopwatch = document.getElementById("stopwatch");
const laserStatus = document.getElementById("laserStatus");
const enemyStatus = document.getElementById("enemyStatus");

const gameMessage = document.getElementById("gameMessage");
const messageText = document.getElementById("messageText");

const GRID_SIZE = 25;

let canvasSize = 0;
let cellSize = 0;

let gameRunning = true;
let gameOver = false;

let survivalTime = 0;

let laserActive = false;
let playerTrail = [];

let enemyTrailActive = true;
let enemyTrail = [];
let enemyTrailTimer = 0;

const ENEMY_TRAIL_MIN_TIME = 0.7;
const ENEMY_TRAIL_MAX_TIME = 2.8;

const SWIPE_DISTANCE = 25;
const TRIPLE_TAP_TIME = 500;

let tapCount = 0;
let tapTimer = null;

const player = {
    x: 3,
    y: 12,
    dir: { x: 1, y: 0 },
    speed: 7.5
};

const enemy = {
    x: 21,
    y: 12,
    dir: { x: -1, y: 0 },
    speed: 6.5
};

let lastTime = performance.now();

let pointerStartX = 0;
let pointerStartY = 0;

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    canvasSize = rect.width;
    cellSize = canvasSize / GRID_SIZE;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function randomRange(min, max) {
    return Math.random() * (max - min) + min;
}

function setEnemyTrailTimer() {
    enemyTrailTimer = randomRange(
        ENEMY_TRAIL_MIN_TIME,
        ENEMY_TRAIL_MAX_TIME
    );
}

function resetGame() {
    player.x = 3;
    player.y = 12;
    player.dir = { x: 1, y: 0 };

    enemy.x = 21;
    enemy.y = 12;
    enemy.dir = { x: -1, y: 0 };

    playerTrail = [];
    laserActive = false;

    enemyTrailActive = true;
    enemyTrail = [
        {
            x: enemy.x,
            y: enemy.y
        }
    ];

    setEnemyTrailTimer();

    survivalTime = 0;

    gameRunning = true;
    gameOver = false;

    gameMessage.style.display = "none";
    pauseMenu.style.display = "none";

    tapCount = 0;
    if (tapTimer) {
        clearTimeout(tapTimer);
        tapTimer = null;
    }

    updateHUD();

    lastTime = performance.now();
}

function updateHUD() {
    const totalHundredths = Math.floor(survivalTime * 100);
    const minutes = Math.floor(totalHundredths / 6000);
    const seconds = Math.floor((totalHundredths % 6000) / 100);
    const hundredths = totalHundredths % 100;

    stopwatch.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0") +
        "." +
        String(hundredths).padStart(2, "0");

    laserStatus.textContent =
        laserActive ? "LASER ACTIVE" : "LASER OFF";

    enemyStatus.textContent =
        enemyTrailActive ? "RED TRAIL ON" : "RED TRAIL OFF";
}

function changeDirection(dx, dy) {
    if (!gameRunning || gameOver) return;

    // Prevent reversing directly into yourself.
    if (
        dx === -player.dir.x &&
        dy === -player.dir.y
    ) {
        return;
    }

    player.dir = { x: dx, y: dy };
}

function moveCycle(cycle, dt) {
    cycle.x += cycle.dir.x * cycle.speed * dt;
    cycle.y += cycle.dir.y * cycle.speed * dt;
}

function updateEnemyTrail(dt) {
    enemyTrailTimer -= dt;

    if (enemyTrailTimer <= 0) {
        enemyTrailActive = !enemyTrailActive;

        if (enemyTrailActive) {
            // Fresh red trail begins EXACTLY where the enemy is now.
            enemyTrail = [
                {
                    x: enemy.x,
                    y: enemy.y
                }
            ];
        } else {
            // Turning the red trail off completely removes it.
            enemyTrail = [];
        }

        setEnemyTrailTimer();
    }

    if (enemyTrailActive) {
        const last = enemyTrail[enemyTrail.length - 1];

        if (
            !last ||
            Math.hypot(
                enemy.x - last.x,
                enemy.y - last.y
            ) > 0.08
        ) {
            enemyTrail.push({
                x: enemy.x,
                y: enemy.y
            });
        }
    }
}

function updatePlayerTrail() {
    if (!laserActive) return;

    const last = playerTrail[playerTrail.length - 1];

    if (
        !last ||
        Math.hypot(
            player.x - last.x,
            player.y - last.y
        ) > 0.08
    ) {
        playerTrail.push({
            x: player.x,
            y: player.y
        });
    }
}

function checkWallCollision(cycle) {
    return (
        cycle.x < 0 ||
        cycle.x >= GRID_SIZE ||
        cycle.y < 0 ||
        cycle.y >= GRID_SIZE
    );
}

function pointToSegmentDistance(px, py, ax, ay, bx, by) {
    const abx = bx - ax;
    const aby = by - ay;

    const apx = px - ax;
    const apy = py - ay;

    const abLengthSquared = abx * abx + aby * aby;

    if (abLengthSquared === 0) {
        return Math.hypot(px - ax, py - ay);
    }

    let t =
        (apx * abx + apy * aby) /
        abLengthSquared;

    t = Math.max(0, Math.min(1, t));

    const closestX = ax + abx * t;
    const closestY = ay + aby * t;

    return Math.hypot(
        px - closestX,
        py - closestY
    );
}

function checkTrailCollision(cycle, trail) {
    if (!trail || trail.length < 2) {
        return false;
    }

    // Keep the newest few points out so a cycle doesn't
    // immediately collide with the trail segment directly
    // underneath its own head.
    const end = Math.max(0, trail.length - 5);

    for (let i = 0; i < end - 1; i++) {
        const a = trail[i];
        const b = trail[i + 1];

        if (
            pointToSegmentDistance(
                cycle.x,
                cycle.y,
                a.x,
                a.y,
                b.x,
                b.y
            ) < 0.32
        ) {
            return true;
        }
    }

    return false;
}

/*
    IMPORTANT CHANGE:
    Both trails are now dangerous to BOTH cycles.

    Player:
      - blue trail can kill player
      - red trail can kill player

    Enemy:
      - blue trail can kill enemy
      - red trail can kill enemy
*/
function checkCollisions() {

    if (checkWallCollision(player)) {
        endGame("YOU CRASHED!");
        return true;
    }

    if (checkWallCollision(enemy)) {
        endGame("RED CYCLE CRASHED!");
        return true;
    }

    // BLUE TRAIL
    // Dangerous to both player AND enemy.
    if (laserActive && playerTrail.length >= 2) {

        if (checkTrailCollision(player, playerTrail)) {
            endGame("YOU HIT THE BLUE TRAIL!");
            return true;
        }

        if (checkTrailCollision(enemy, playerTrail)) {
            endGame("RED CYCLE HIT THE BLUE TRAIL!");
            return true;
        }
    }

    // RED TRAIL
    // Dangerous to both enemy AND player.
    if (enemyTrailActive && enemyTrail.length >= 2) {

        if (checkTrailCollision(player, enemyTrail)) {
            endGame("YOU HIT THE RED TRAIL!");
            return true;
        }

        if (checkTrailCollision(enemy, enemyTrail)) {
            endGame("RED CYCLE HIT ITS TRAIL!");
            return true;
        }
    }

    return false;
}

function enemyAI() {
    const possibleDirections = [
        { x: 1, y: 0 },
        { x: -1, y: 0 },
        { x: 0, y: 1 },
        { x: 0, y: -1 }
    ];

    const validDirections = possibleDirections.filter(d => {

        if (
            d.x === -enemy.dir.x &&
            d.y === -enemy.dir.y
        ) {
            return false;
        }

        const lookAhead = 1.5;

        const nx = enemy.x + d.x * lookAhead;
        const ny = enemy.y + d.y * lookAhead;

        if (
            nx < 0.7 ||
            nx > GRID_SIZE - 0.7 ||
            ny < 0.7 ||
            ny > GRID_SIZE - 0.7
        ) {
            return false;
        }

        /*
            The enemy treats BOTH trails as dangerous.
        */
        if (
            checkTrailCollision(
                { x: nx, y: ny },
                playerTrail
            )
        ) {
            return false;
        }

        if (
            checkTrailCollision(
                { x: nx, y: ny },
                enemyTrail
            )
        ) {
            return false;
        }

        return true;
    });

    if (validDirections.length === 0) {
        return;
    }

    const current = validDirections.find(d =>
        d.x === enemy.dir.x &&
        d.y === enemy.dir.y
    );

    if (current && Math.random() > 0.08) {
        return;
    }

    // Occasionally steer toward the player,
    // while still avoiding both trails.
    const towardPlayer = validDirections
        .slice()
        .sort((a, b) => {

            const da =
                Math.abs(
                    enemy.x + a.x * 4 - player.x
                ) +
                Math.abs(
                    enemy.y + a.y * 4 - player.y
                );

            const db =
                Math.abs(
                    enemy.x + b.x * 4 - player.x
                ) +
                Math.abs(
                    enemy.y + b.y * 4 - player.y
                );

            return da - db;
        });

    if (Math.random() < 0.55 && towardPlayer.length) {
        enemy.dir = towardPlayer[0];
    } else {
        enemy.dir =
            validDirections[
                Math.floor(
                    Math.random() *
                    validDirections.length
                )
            ];
    }
}

function endGame(message) {
    if (gameOver) return;

    gameOver = true;
    gameRunning = false;

    messageText.textContent = message;
    gameMessage.style.display = "flex";
}

function drawGrid() {
    ctx.save();

    ctx.strokeStyle = "rgba(0, 110, 255, 0.12)";
    ctx.lineWidth = 1;

    for (let i = 0; i <= GRID_SIZE; i++) {
        const p = i * cellSize;

        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvasSize);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvasSize, p);
        ctx.stroke();
    }

    ctx.restore();
}

function drawTrail(trail, color) {
    if (!trail || trail.length < 2) {
        return;
    }

    ctx.save();

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.shadowColor = color;
    ctx.shadowBlur = 16;

    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(3, cellSize * 0.25);

    ctx.beginPath();

    ctx.moveTo(
        trail[0].x * cellSize,
        trail[0].y * cellSize
    );

    for (let i = 1; i < trail.length; i++) {
        ctx.lineTo(
            trail[i].x * cellSize,
            trail[i].y * cellSize
        );
    }

    ctx.stroke();

    ctx.shadowBlur = 0;

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = Math.max(1, cellSize * 0.07);

    ctx.beginPath();

    ctx.moveTo(
        trail[0].x * cellSize,
        trail[0].y * cellSize
    );

    for (let i = 1; i < trail.length; i++) {
        ctx.lineTo(
            trail[i].x * cellSize,
            trail[i].y * cellSize
        );
    }

    ctx.stroke();

    ctx.restore();
}

function drawCycle(cycle, mainColor, darkColor) {
    const x = cycle.x * cellSize;
    const y = cycle.y * cellSize;

    const angle =
        Math.atan2(cycle.dir.y, cycle.dir.x);

    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.shadowColor = mainColor;
    ctx.shadowBlur = 18;

    // Black body
    ctx.fillStyle = darkColor;

    ctx.fillRect(
        -cellSize * 0.55,
        -cellSize * 0.22,
        cellSize * 1.1,
        cellSize * 0.44
    );

    // Neon light
    ctx.fillStyle = mainColor;

    ctx.fillRect(
        -cellSize * 0.58,
        -cellSize * 0.12,
        cellSize * 1.16,
        cellSize * 0.24
    );

    // Front light
    ctx.fillRect(
        cellSize * 0.32,
        -cellSize * 0.25,
        cellSize * 0.28,
        cellSize * 0.5
    );

    ctx.restore();
}

function draw() {
    ctx.clearRect(
        0,
        0,
        canvasSize,
        canvasSize
    );

    drawGrid();

    // Blue player trail
    if (laserActive) {
        drawTrail(playerTrail, "#00c8ff");
    }

    // Red enemy trail
    if (enemyTrailActive) {
        drawTrail(enemyTrail, "#ff2222");
    }

    drawCycle(
        player,
        "#00c8ff",
        "#00141f"
    );

    drawCycle(
        enemy,
        "#ff2222",
        "#200000"
    );
}

function update(dt) {
    if (!gameRunning || gameOver) {
        return;
    }

    survivalTime += dt;

    moveCycle(player, dt);
    moveCycle(enemy, dt);

    updatePlayerTrail();
    updateEnemyTrail(dt);

    enemyAI();

    checkCollisions();

    updateHUD();
}

function gameLoop(now) {
    const dt = Math.min(
        (now - lastTime) / 1000,
        0.05
    );

    lastTime = now;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

function toggleLaser() {
    if (!gameRunning || gameOver) return;

    laserActive = !laserActive;

    if (laserActive) {
        // Fresh blue trail begins EXACTLY where player is now.
        playerTrail = [
            {
                x: player.x,
                y: player.y
            }
        ];
    } else {
        // Turning blue trail off completely removes it.
        playerTrail = [];
    }

    updateHUD();
}

function togglePause() {
    if (gameOver) return;

    gameRunning = !gameRunning;

    if (gameRunning) {
        pauseMenu.style.display = "none";
        lastTime = performance.now();
    } else {
        pauseMenu.style.display = "flex";
    }
}

pauseButton.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();
});

pauseButton.addEventListener("pointerup", e => {
    e.preventDefault();
    e.stopPropagation();
    togglePause();
});

resumeButton.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();

    if (!gameOver) {
        gameRunning = true;
        pauseMenu.style.display = "none";
        lastTime = performance.now();
    }
});

restartButton.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();
    resetGame();
});

canvas.addEventListener("pointerdown", e => {
    pointerStartX = e.clientX;
    pointerStartY = e.clientY;
});

canvas.addEventListener("pointerup", e => {
    const dx = e.clientX - pointerStartX;
    const dy = e.clientY - pointerStartY;

    const distance = Math.hypot(dx, dy);

    if (distance < SWIPE_DISTANCE) {
        return;
    }

    if (!gameRunning || gameOver) {
        return;
    }

    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) {
            changeDirection(1, 0);
        } else {
            changeDirection(-1, 0);
        }
    } else {
        if (dy > 0) {
            changeDirection(0, 1);
        } else {
            changeDirection(0, -1);
        }
    }
});

canvas.addEventListener("pointerup", e => {
    const dx = e.clientX - pointerStartX;
    const dy = e.clientY - pointerStartY;

    const distance = Math.hypot(dx, dy);

    if (distance >= SWIPE_DISTANCE) {
        return;
    }

    if (!gameRunning || gameOver) {
        return;
    }

    tapCount++;

    if (tapCount === 1) {
        tapTimer = setTimeout(() => {
            tapCount = 0;
        }, TRIPLE_TAP_TIME);
    }

    if (tapCount === 3) {
        clearTimeout(tapTimer);
        tapTimer = null;
        tapCount = 0;

        toggleLaser();
    }
});

document.addEventListener("keydown", e => {

    if (
        e.key === "ArrowUp" ||
        e.key.toLowerCase() === "w"
    ) {
        changeDirection(0, -1);
    }

    if (
        e.key === "ArrowDown" ||
        e.key.toLowerCase() === "s"
    ) {
        changeDirection(0, 1);
    }

    if (
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ) {
        changeDirection(-1, 0);
    }

    if (
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ) {
        changeDirection(1, 0);
    }

    if (e.key === " " || e.key.toLowerCase() === "p") {
        e.preventDefault();
        togglePause();
    }

    if (e.key.toLowerCase() === "l") {
        toggleLaser();
    }
});

resetGame();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Light Cycle</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020611;
        font-family: Arial, Helvetica, sans-serif;
        touch-action: none;
        user-select: none;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 45%,
                rgba(0, 120, 255, 0.16),
                transparent 48%),
            radial-gradient(circle at 20% 80%,
                rgba(0, 80, 255, 0.12),
                transparent 40%),
            #020611;
    }

    canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    #pauseButton {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 10;

        width: 48px;
        height: 48px;

        border: 1px solid rgba(80, 190, 255, 0.8);
        border-radius: 10px;

        background: rgba(0, 10, 25, 0.78);
        color: #75d9ff;

        font-size: 24px;
        font-weight: bold;

        box-shadow:
            0 0 10px rgba(0, 150, 255, 0.35),
            inset 0 0 10px rgba(0, 100, 255, 0.12);

        display: flex;
        align-items: center;
        justify-content: center;

        touch-action: manipulation;
    }

    #pauseMenu {
        position: absolute;
        inset: 0;
        z-index: 20;

        display: none;
        align-items: center;
        justify-content: center;

        background: rgba(0, 3, 12, 0.72);
        backdrop-filter: blur(5px);
    }

    #pausePanel {
        width: min(320px, 82vw);
        padding: 28px;

        border: 1px solid rgba(70, 190, 255, 0.7);
        border-radius: 16px;

        background:
            linear-gradient(
                145deg,
                rgba(3, 17, 38, 0.96),
                rgba(0, 7, 18, 0.96)
            );

        box-shadow:
            0 0 25px rgba(0, 130, 255, 0.25),
            inset 0 0 25px rgba(0, 100, 255, 0.08);

        text-align: center;
        color: white;
    }

    #pausePanel h1 {
        margin: 0 0 8px;
        color: #72d8ff;
        font-size: 30px;
        letter-spacing: 3px;
        text-shadow: 0 0 12px rgba(60, 190, 255, 0.8);
    }

    #pausePanel p {
        margin: 0 0 22px;
        color: #8da6c2;
        font-size: 14px;
    }

    .menuButton {
        width: 100%;
        min-height: 48px;
        margin-top: 10px;

        border: 1px solid rgba(70, 190, 255, 0.65);
        border-radius: 10px;

        background: rgba(0, 35, 70, 0.7);
        color: #9ce5ff;

        font-size: 16px;
        font-weight: bold;
        letter-spacing: 1px;

        box-shadow: 0 0 12px rgba(0, 120, 255, 0.18);
    }

    .menuButton:active {
        transform: scale(0.97);
        background: rgba(0, 65, 115, 0.8);
    }

    #message {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);

        z-index: 8;

        color: white;
        text-align: center;

        pointer-events: none;

        opacity: 0;
        transition: opacity 0.2s;
    }

    #message h2 {
        margin: 0;
        font-size: 34px;
        letter-spacing: 4px;
        text-shadow: 0 0 15px #48caff;
    }

    #message p {
        margin-top: 8px;
        color: #9db8d0;
        font-size: 14px;
    }
</style>
</head>

<body>

<div id="game">
    <canvas id="canvas"></canvas>

    <button id="pauseButton" aria-label="Pause">Ⅱ</button>

    <div id="message">
        <h2 id="messageTitle"></h2>
        <p id="messageText"></p>
    </div>

    <div id="pauseMenu">
        <div id="pausePanel">
            <h1>PAUSED</h1>
            <p>Light Cycle Arena</p>

            <button class="menuButton" id="resumeButton">
                RESUME
            </button>

            <button class="menuButton" id="restartButton">
                RESTART
            </button>
        </div>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   LIGHT CYCLE
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const game = document.getElementById("game");

const pauseButton = document.getElementById("pauseButton");
const pauseMenu = document.getElementById("pauseMenu");
const resumeButton = document.getElementById("resumeButton");
const restartButton = document.getElementById("restartButton");

const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");


/* =========================================================
   ARENA SETTINGS
   ========================================================= */

const GRID_SIZE = 25;

let width = 0;
let height = 0;

let arenaSize = 0;
let arenaLeft = 0;
let arenaTop = 0;

let cellSize = 0;


/* =========================================================
   GAME SETTINGS
   ========================================================= */

const PLAYER_SPEED = 7.5;
const ENEMY_SPEED = 6.5;

const PLAYER_COLOR = "#65d9ff";
const PLAYER_CORE = "#e7faff";

const ENEMY_COLOR = "#ff304f";
const ENEMY_CORE = "#fff0f3";

const GRID_COLOR = "#075ea8";

const TRAIL_WIDTH = 5;

const DIRECTIONS = {
    UP:    { x: 0,  y: -1 },
    DOWN:  { x: 0,  y: 1 },
    LEFT:  { x: -1, y: 0 },
    RIGHT: { x: 1,  y: 0 }
};


/* =========================================================
   STATE
   ========================================================= */

let paused = false;
let gameOver = false;

let player;
let enemy;

let playerTrail = [];
let enemyTrail = [];

let laserActive = false;

let lastTime = 0;


/* =========================================================
   PLAYER
   ========================================================= */

function createPlayer() {
    return {
        x: 3,
        y: 12,

        dir: "RIGHT",
        nextDir: "RIGHT",

        color: PLAYER_COLOR,
        core: PLAYER_CORE,

        speed: PLAYER_SPEED,

        trailEnabled: false,

        distance: 0
    };
}


/* =========================================================
   ENEMY
   ========================================================= */

function createEnemy() {
    return {
        x: 21,
        y: 12,

        dir: "LEFT",
        nextDir: "LEFT",

        color: ENEMY_COLOR,
        core: ENEMY_CORE,

        speed: ENEMY_SPEED,

        distance: 0
    };
}


/* =========================================================
   RESET
   ========================================================= */

function resetGame() {

    player = createPlayer();
    enemy = createEnemy();

    playerTrail = [];
    enemyTrail = [];

    laserActive = false;

    paused = false;
    gameOver = false;

    hideMessage();

    pauseMenu.style.display = "none";

    lastTime = performance.now();
}


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    arenaSize = Math.min(width, height) * 0.82;

    arenaSize = Math.max(
        260,
        Math.min(arenaSize, Math.min(width, height) - 50)
    );

    arenaLeft = (width - arenaSize) / 2;
    arenaTop = (height - arenaSize) / 2;

    cellSize = arenaSize / GRID_SIZE;
}

window.addEventListener("resize", resize);


/* =========================================================
   GRID POSITION
   ========================================================= */

function gridToPixel(x, y) {

    return {
        x: arenaLeft + x * cellSize,
        y: arenaTop + y * cellSize
    };
}


/* =========================================================
   VALID DIRECTION
   ========================================================= */

function isOpposite(a, b) {

    return (
        (a === "UP" && b === "DOWN") ||
        (a === "DOWN" && b === "UP") ||
        (a === "LEFT" && b === "RIGHT") ||
        (a === "RIGHT" && b === "LEFT")
    );
}


/* =========================================================
   CHANGE DIRECTION
   ========================================================= */

function changePlayerDirection(newDirection) {

    if (paused || gameOver) return;

    if (isOpposite(player.dir, newDirection)) {
        return;
    }

    player.nextDir = newDirection;
}


/* =========================================================
   SWIPE CONTROLS
   ========================================================= */

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

const SWIPE_DISTANCE = 25;
const SWIPE_TIME = 700;

game.addEventListener("pointerdown", function(event) {

    if (
        event.target === pauseButton ||
        event.target.closest("#pauseMenu")
    ) {
        return;
    }

    touchStartX = event.clientX;
    touchStartY = event.clientY;
    touchStartTime = performance.now();
});


game.addEventListener("pointerup", function(event) {

    if (
        event.target === pauseButton ||
        event.target.closest("#pauseMenu")
    ) {
        return;
    }

    if (paused || gameOver) return;

    const dx = event.clientX - touchStartX;
    const dy = event.clientY - touchStartY;

    const distance = Math.sqrt(dx * dx + dy * dy);
    const elapsed = performance.now() - touchStartTime;

    if (distance < SWIPE_DISTANCE) return;
    if (elapsed > SWIPE_TIME) return;

    if (Math.abs(dx) > Math.abs(dy)) {

        if (dx > 0) {
            changePlayerDirection("RIGHT");
        } else {
            changePlayerDirection("LEFT");
        }

    } else {

        if (dy > 0) {
            changePlayerDirection("DOWN");
        } else {
            changePlayerDirection("UP");
        }
    }
});


/* =========================================================
   DOUBLE TAP = LASER
   ========================================================= */

let lastTap = 0;

game.addEventListener("pointerup", function(event) {

    if (
        event.target === pauseButton ||
        event.target.closest("#pauseMenu")
    ) {
        return;
    }

    if (paused || gameOver) return;

    const now = performance.now();

    if (now - lastTap < 320) {

        laserActive = !laserActive;
        player.trailEnabled = laserActive;

    }

    lastTap = now;
});


/* =========================================================
   KEYBOARD SUPPORT
   ========================================================= */

window.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") {
        changePlayerDirection("UP");
    }

    if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") {
        changePlayerDirection("DOWN");
    }

    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        changePlayerDirection("LEFT");
    }

    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        changePlayerDirection("RIGHT");
    }

    if (event.key === " " || event.key.toLowerCase() === "p") {
        togglePause();
    }

    if (event.key === "l") {
        laserActive = !laserActive;
        player.trailEnabled = laserActive;
    }
});


/* =========================================================
   PAUSE
   ========================================================= */

function togglePause() {

    if (gameOver) return;

    paused = !paused;

    pauseMenu.style.display = paused ? "flex" : "none";

    if (!paused) {
        lastTime = performance.now();
    }
}


pauseButton.addEventListener("click", function(event) {

    event.stopPropagation();
    togglePause();

});


resumeButton.addEventListener("click", function() {

    paused = false;

    pauseMenu.style.display = "none";

    lastTime = performance.now();

});


restartButton.addEventListener("click", function() {

    resetGame();

});


/* =========================================================
   MOVE CYCLE
   ========================================================= */

function moveCycle(cycle, trail, dt) {

    cycle.dir = cycle.nextDir;

    const direction = DIRECTIONS[cycle.dir];

    cycle.x += direction.x * cycle.speed * dt;
    cycle.y += direction.y * cycle.speed * dt;

    cycle.distance += cycle.speed * dt;

    if (
        cycle.x < 0 ||
        cycle.x > GRID_SIZE ||
        cycle.y < 0 ||
        cycle.y > GRID_SIZE
    ) {
        gameOver = true;

        showMessage(
            "CRASHED",
            "You hit the arena wall"
        );

        return;
    }

    if (
        trail.length === 0 ||
        distanceBetween(
            cycle.x,
            cycle.y,
            trail[trail.length - 1].x,
            trail[trail.length - 1].y
        ) > 0.08
    ) {

        trail.push({
            x: cycle.x,
            y: cycle.y
        });
    }

    if (trail.length > 2500) {
        trail.shift();
    }
}


/* =========================================================
   DISTANCE
   ========================================================= */

function distanceBetween(x1, y1, x2, y2) {

    const dx = x1 - x2;
    const dy = y1 - y2;

    return Math.sqrt(dx * dx + dy * dy);
}


/* =========================================================
   TRAIL COLLISION
   ========================================================= */

function checkTrailCollision(cycle, trail) {

    const checkDistance = 0.35;

    for (let i = 0; i < trail.length - 5; i++) {

        const point = trail[i];

        if (
            Math.abs(cycle.x - point.x) < checkDistance &&
            Math.abs(cycle.y - point.y) < checkDistance
        ) {
            return true;
        }
    }

    return false;
}


/* =========================================================
   CYCLE COLLISION
   ========================================================= */

function checkCycleCollision() {

    if (
        distanceBetween(
            player.x,
            player.y,
            enemy.x,
            enemy.y
        ) < 0.75
    ) {
        return true;
    }

    return false;
}


/* =========================================================
   ENEMY AI
   ========================================================= */

function updateEnemyAI() {

    const possibleDirections = [
        "UP",
        "DOWN",
        "LEFT",
        "RIGHT"
    ];

    const safeDirections = possibleDirections.filter(dir => {

        if (isOpposite(enemy.dir, dir)) {
            return false;
        }

        const direction = DIRECTIONS[dir];

        const testX = enemy.x + direction.x * 1.5;
        const testY = enemy.y + direction.y * 1.5;

        if (
            testX < 0.5 ||
            testX > GRID_SIZE - 0.5 ||
            testY < 0.5 ||
            testY > GRID_SIZE - 0.5
        ) {
            return false;
        }

        if (
            checkPointAgainstTrail(
                testX,
                testY,
                enemyTrail
            )
        ) {
            return false;
        }

        if (
            checkPointAgainstTrail(
                testX,
                testY,
                playerTrail
            )
        ) {
            return false;
        }

        return true;
    });

    if (safeDirections.length === 0) {
        return;
    }

    const currentDirection = enemy.dir;

    if (safeDirections.includes(currentDirection)) {

        if (Math.random() < 0.025) {

            const turns = safeDirections.filter(
                d => d !== currentDirection
            );

            if (turns.length > 0) {
                enemy.nextDir =
                    turns[Math.floor(Math.random() * turns.length)];
            }
        }

    } else {

        enemy.nextDir =
            safeDirections[
                Math.floor(Math.random() * safeDirections.length)
            ];
    }
}


/* =========================================================
   TRAIL POINT CHECK
   ========================================================= */

function checkPointAgainstTrail(x, y, trail) {

    const checkDistance = 0.42;

    for (let i = 0; i < trail.length; i++) {

        const point = trail[i];

        if (
            Math.abs(x - point.x) < checkDistance &&
            Math.abs(y - point.y) < checkDistance
        ) {
            return true;
        }
    }

    return false;
}


/* =========================================================
   UPDATE
   ========================================================= */

function update(dt) {

    if (paused || gameOver) return;

    updateEnemyAI();

    moveCycle(player, playerTrail, dt);
    moveCycle(enemy, enemyTrail, dt);

    if (gameOver) return;

    if (
        player.trailEnabled &&
        checkTrailCollision(player, enemyTrail)
    ) {
        gameOver = true;

        showMessage(
            "CRASHED",
            "You hit the red light trail"
        );

        return;
    }

    if (
        checkTrailCollision(enemy, playerTrail)
    ) {
        gameOver = true;

        showMessage(
            "VICTORY",
            "The red cycle crashed"
        );

        return;
    }

    if (checkCycleCollision()) {

        gameOver = true;

        showMessage(
            "CRASH",
            "The cycles collided"
        );
    }
}


/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground() {

    const gradient = ctx.createRadialGradient(
        width / 2,
        height / 2,
        20,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.7
    );

    gradient.addColorStop(0, "#041d3a");
    gradient.addColorStop(0.5, "#020d24");
    gradient.addColorStop(1, "#01030b");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);


    /* blue neon atmosphere */

    ctx.save();

    ctx.globalAlpha = 0.18;

    for (let i = 0; i < 12; i++) {

        const x =
            (i * 173 + performance.now() * 0.012) % width;

        const y =
            (i * 97) % height;

        const radius = 80 + (i % 4) * 35;

        const glow = ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );

        glow.addColorStop(
            0,
            "rgba(0,150,255,0.5)"
        );

        glow.addColorStop(
            1,
            "rgba(0,50,255,0)"
        );

        ctx.fillStyle = glow;

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   DRAW ARENA
   ========================================================= */

function drawArena() {

    ctx.save();

    /* outer glow */

    ctx.shadowBlur = 25;
    ctx.shadowColor = "rgba(0, 130, 255, 0.8)";

    ctx.strokeStyle = "#087cff";
    ctx.lineWidth = 3;

    ctx.strokeRect(
        arenaLeft,
        arenaTop,
        arenaSize,
        arenaSize
    );

    ctx.shadowBlur = 0;


    /* black arena surface */

    ctx.fillStyle = "rgba(0, 3, 10, 0.78)";

    ctx.fillRect(
        arenaLeft,
        arenaTop,
        arenaSize,
        arenaSize
    );


    /* 25 × 25 grid */

    for (let i = 0; i <= GRID_SIZE; i++) {

        const position =
            arenaLeft + i * cellSize;

        ctx.beginPath();
        ctx.moveTo(position, arenaTop);
        ctx.lineTo(position, arenaTop + arenaSize);

        ctx.strokeStyle =
            i === 0 || i === GRID_SIZE
                ? "rgba(0,170,255,0.7)"
                : "rgba(0,100,190,0.25)";

        ctx.lineWidth =
            i === 0 || i === GRID_SIZE
                ? 2
                : 1;

        ctx.stroke();
    }


    for (let i = 0; i <= GRID_SIZE; i++) {

        const position =
            arenaTop + i * cellSize;

        ctx.beginPath();
        ctx.moveTo(arenaLeft, position);
        ctx.lineTo(arenaLeft + arenaSize, position);

        ctx.strokeStyle =
            i === 0 || i === GRID_SIZE
                ? "rgba(0,170,255,0.7)"
                : "rgba(0,100,190,0.25)";

        ctx.lineWidth =
            i === 0 || i === GRID_SIZE
                ? 2
                : 1;

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   DRAW TRAIL
   ========================================================= */

function drawTrail(trail, color) {

    if (trail.length < 2) return;

    ctx.save();

    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    /* outer glow */

    ctx.beginPath();

    for (let i = 0; i < trail.length; i++) {

        const point = gridToPixel(
            trail[i].x,
            trail[i].y
        );

        if (i === 0) {
            ctx.moveTo(point.x, point.y);
        } else {
            ctx.lineTo(point.x, point.y);
        }
    }

    ctx.strokeStyle = color;
    ctx.lineWidth = TRAIL_WIDTH + 10;

    ctx.globalAlpha = 0.22;
    ctx.shadowBlur = 25;
    ctx.shadowColor = color;

    ctx.stroke();


    /* main trail */

    ctx.beginPath();

    for (let i = 0; i < trail.length; i++) {

        const point = gridToPixel(
            trail[i].x,
            trail[i].y
        );

        if (i === 0) {
            ctx.moveTo(point.x, point.y);
        } else {
            ctx.lineTo(point.x, point.y);
        }
    }

    ctx.globalAlpha = 0.9;
    ctx.shadowBlur = 12;
    ctx.shadowColor = color;

    ctx.strokeStyle = color;
    ctx.lineWidth = TRAIL_WIDTH;

    ctx.stroke();


    /* white center */

    ctx.globalAlpha = 0.9;
    ctx.shadowBlur = 5;
    ctx.shadowColor = "#ffffff";

    ctx.strokeStyle = "#dff8ff";
    ctx.lineWidth = 1.5;

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   DRAW CYCLE
   ========================================================= */

function drawCycle(cycle) {

    const center = gridToPixel(
        cycle.x,
        cycle.y
    );

    const length = cellSize * 0.92;
    const thickness = Math.max(7, cellSize * 0.25);

    let angle = 0;

    if (cycle.dir === "UP") {
        angle = -Math.PI / 2;
    }

    if (cycle.dir === "DOWN") {
        angle = Math.PI / 2;
    }

    if (cycle.dir === "LEFT") {
        angle = Math.PI;
    }

    if (cycle.dir === "RIGHT") {
        angle = 0;
    }


    ctx.save();

    ctx.translate(center.x, center.y);
    ctx.rotate(angle);


    /* long outer body */

    ctx.shadowBlur = 24;
    ctx.shadowColor = cycle.color;

    ctx.fillStyle = cycle.color;

    ctx.beginPath();

    ctx.roundRect(
        -length / 2,
        -thickness / 2,
        length,
        thickness,
        thickness / 2
    );

    ctx.fill();


    /* black center */

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#02040a";

    ctx.beginPath();

    ctx.roundRect(
        -length / 2 + 3,
        -thickness / 2 + 2,
        length - 6,
        thickness - 4,
        thickness / 2
    );

    ctx.fill();


    /* bright neon core */

    ctx.fillStyle = cycle.core;

    ctx.shadowBlur = 10;
    ctx.shadowColor = cycle.color;

    ctx.beginPath();

    ctx.roundRect(
        -length / 2 + 4,
        -1,
        length - 8,
        2,
        1
    );

    ctx.fill();


    /* front light */

    ctx.fillStyle = cycle.color;

    ctx.shadowBlur = 18;

    ctx.beginPath();

    ctx.arc(
        length / 2 - 2,
        0,
        thickness * 0.28,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   DRAW HUD
   ========================================================= */

function drawHUD() {

    ctx.save();

    ctx.font = "bold 12px Arial";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "rgba(150,220,255,0.8)";
    ctx.fillText(
        "25 × 25",
        arenaLeft,
        arenaTop - 12
    );

    if (laserActive) {

        ctx.fillStyle = "#67dfff";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#39caff";

        ctx.fillText(
            "LASER ACTIVE",
            arenaLeft + arenaSize - 90,
            arenaTop - 12
        );
    }

    ctx.restore();
}


/* =========================================================
   DRAW
   ========================================================= */

function draw() {

    ctx.clearRect(0, 0, width, height);

    drawBackground();

    drawArena();

    /*
       The red cycle always leaves its red light trail.
    */

    drawTrail(
        enemyTrail,
        ENEMY_COLOR
    );

    /*
       The player's blue trail only appears
       after a double tap activates the laser.
    */

    if (player.trailEnabled) {

        drawTrail(
            playerTrail,
            PLAYER_COLOR
        );
    }

    drawCycle(enemy);
    drawCycle(player);

    drawHUD();
}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(title, text) {

    messageTitle.textContent = title;
    messageText.textContent = text;

    message.style.opacity = "1";
}


function hideMessage() {

    message.style.opacity = "0";
}


/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(time) {

    const dt = Math.min(
        (time - lastTime) / 1000,
        0.04
    );

    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}


/* =========================================================
   START
   ========================================================= */

resize();
resetGame();

requestAnimationFrame(loop);

</script>

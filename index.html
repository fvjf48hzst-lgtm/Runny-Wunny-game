<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Neon Light Cycle</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020611;
        font-family: Arial, Helvetica, sans-serif;
        touch-action: none;
        user-select: none;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;

        background:
            radial-gradient(
                circle at 50% 45%,
                rgba(0, 120, 255, 0.16),
                transparent 48%
            ),
            radial-gradient(
                circle at 20% 80%,
                rgba(0, 80, 255, 0.12),
                transparent 40%
            ),
            #020611;
    }

    canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    /* =====================================================
       PAUSE BUTTON
       ===================================================== */

    #pauseButton {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 100;

        width: 48px;
        height: 48px;

        border: 1px solid rgba(80, 190, 255, 0.8);
        border-radius: 10px;

        background: rgba(0, 10, 25, 0.88);
        color: #75d9ff;

        font-size: 24px;
        font-weight: bold;

        box-shadow:
            0 0 10px rgba(0, 150, 255, 0.35),
            inset 0 0 10px rgba(0, 100, 255, 0.12);

        display: flex;
        align-items: center;
        justify-content: center;

        touch-action: manipulation;

        cursor: pointer;
    }

    #pauseButton:active {
        transform: scale(0.94);
        background: rgba(0, 35, 65, 0.95);
    }

    /* =====================================================
       PAUSE MENU
       ===================================================== */

    #pauseMenu {
        position: absolute;
        inset: 0;
        z-index: 90;

        display: none;
        align-items: center;
        justify-content: center;

        background: rgba(0, 3, 12, 0.72);
        backdrop-filter: blur(5px);

        touch-action: auto;
    }

    #pausePanel {
        width: min(320px, 82vw);
        padding: 28px;

        border: 1px solid rgba(70, 190, 255, 0.7);
        border-radius: 16px;

        background:
            linear-gradient(
                145deg,
                rgba(3, 17, 38, 0.96),
                rgba(0, 7, 18, 0.96)
            );

        box-shadow:
            0 0 25px rgba(0, 130, 255, 0.25),
            inset 0 0 25px rgba(0, 100, 255, 0.08);

        text-align: center;
        color: white;
    }

    #pausePanel h1 {
        margin: 0 0 8px;

        color: #72d8ff;

        font-size: 30px;
        letter-spacing: 3px;

        text-shadow:
            0 0 12px rgba(60, 190, 255, 0.8);
    }

    #pausePanel p {
        margin: 0 0 22px;

        color: #8da6c2;
        font-size: 14px;
    }

    .menuButton {
        width: 100%;
        min-height: 48px;

        margin-top: 10px;

        border: 1px solid rgba(70, 190, 255, 0.65);
        border-radius: 10px;

        background: rgba(0, 35, 70, 0.7);
        color: #9ce5ff;

        font-size: 16px;
        font-weight: bold;
        letter-spacing: 1px;

        box-shadow:
            0 0 12px rgba(0, 120, 255, 0.18);

        cursor: pointer;

        touch-action: manipulation;
    }

    .menuButton:active {
        transform: scale(0.97);
        background: rgba(0, 65, 115, 0.8);
    }

    /* =====================================================
       MESSAGE
       ===================================================== */

    #message {
        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        z-index: 80;

        color: white;
        text-align: center;

        pointer-events: none;

        opacity: 0;

        transition: opacity 0.2s;
    }

    #message h2 {
        margin: 0;

        font-size: 34px;
        letter-spacing: 4px;

        text-shadow:
            0 0 15px #48caff;
    }

    #message p {
        margin-top: 8px;

        color: #9db8d0;
        font-size: 14px;
    }
</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <!-- PAUSE -->
    <button
        id="pauseButton"
        type="button"
        aria-label="Pause game"
    >Ⅱ</button>


    <!-- MESSAGE -->
    <div id="message">
        <h2 id="messageTitle"></h2>
        <p id="messageText"></p>
    </div>


    <!-- PAUSE MENU -->
    <div id="pauseMenu">

        <div id="pausePanel">

            <h1>PAUSED</h1>

            <p>Light Cycle Arena</p>

            <button
                class="menuButton"
                id="resumeButton"
                type="button"
            >
                RESUME
            </button>

            <button
                class="menuButton"
                id="restartButton"
                type="button"
            >
                RESTART
            </button>

        </div>

    </div>

</div>


<script>
"use strict";


/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const game = document.getElementById("game");

const pauseButton =
    document.getElementById("pauseButton");

const pauseMenu =
    document.getElementById("pauseMenu");

const resumeButton =
    document.getElementById("resumeButton");

const restartButton =
    document.getElementById("restartButton");

const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");


/* =========================================================
   ARENA
   ========================================================= */

const GRID_SIZE = 25;

let width = 0;
let height = 0;

let arenaSize = 0;
let arenaLeft = 0;
let arenaTop = 0;

let cellSize = 0;


/* =========================================================
   GAME SETTINGS
   ========================================================= */

const PLAYER_SPEED = 7.5;
const ENEMY_SPEED = 6.5;

const PLAYER_COLOR = "#65d9ff";
const PLAYER_CORE = "#e7faff";

const ENEMY_COLOR = "#ff304f";
const ENEMY_CORE = "#fff0f3";

const TRAIL_WIDTH = 5;

const DIRECTIONS = {

    UP: {
        x: 0,
        y: -1
    },

    DOWN: {
        x: 0,
        y: 1
    },

    LEFT: {
        x: -1,
        y: 0
    },

    RIGHT: {
        x: 1,
        y: 0
    }

};


/* =========================================================
   GAME STATE
   ========================================================= */

let paused = false;
let gameOver = false;

let player;
let enemy;

let playerTrail = [];
let enemyTrail = [];

let laserActive = false;


/* =========================================================
   STOPWATCH
   ========================================================= */

let survivalTime = 0;


/* =========================================================
   RED TRAIL RANDOMIZER
   ========================================================= */

let enemyTrailActive = false;

let enemyTrailTimer = 0;

let enemyTrailNextChange = 0;


/*
    These values make the red trail randomly
    turn on and off.

    It can stay off for a random amount of time,
    then turn on for a random amount of time.
*/

const ENEMY_TRAIL_MIN_TIME = 0.7;
const ENEMY_TRAIL_MAX_TIME = 2.8;


/* =========================================================
   TIMING
   ========================================================= */

let lastTime = 0;


/* =========================================================
   CREATE PLAYER
   ========================================================= */

function createPlayer() {

    return {

        x: 3,
        y: 12,

        dir: "RIGHT",
        nextDir: "RIGHT",

        color: PLAYER_COLOR,
        core: PLAYER_CORE,

        speed: PLAYER_SPEED,

        trailEnabled: false

    };

}


/* =========================================================
   CREATE ENEMY
   ========================================================= */

function createEnemy() {

    return {

        x: 21,
        y: 12,

        dir: "LEFT",
        nextDir: "LEFT",

        color: ENEMY_COLOR,
        core: ENEMY_CORE,

        speed: ENEMY_SPEED

    };

}


/* =========================================================
   RANDOM TRAIL TIMER
   ========================================================= */

function randomEnemyTrailTime() {

    return (
        ENEMY_TRAIL_MIN_TIME +
        Math.random() *
        (
            ENEMY_TRAIL_MAX_TIME -
            ENEMY_TRAIL_MIN_TIME
        )
    );

}


/* =========================================================
   RESET
   ========================================================= */

function resetGame() {

    player = createPlayer();
    enemy = createEnemy();

    playerTrail = [];
    enemyTrail = [];

    laserActive = false;
    player.trailEnabled = false;


    /*
        Start the red cycle with its trail ON.
    */

    enemyTrailActive = true;

    enemyTrailTimer = 0;

    enemyTrailNextChange =
        randomEnemyTrailTime();


    /*
        Reset stopwatch.
    */

    survivalTime = 0;


    paused = false;
    gameOver = false;

    pauseMenu.style.display = "none";

    hideMessage();

    lastTime = performance.now();

}


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    arenaSize =
        Math.min(width, height) * 0.82;


    arenaSize =
        Math.max(
            260,
            Math.min(
                arenaSize,
                Math.min(width, height) - 50
            )
        );


    arenaLeft =
        (width - arenaSize) / 2;

    arenaTop =
        (height - arenaSize) / 2;

    cellSize =
        arenaSize / GRID_SIZE;

}


/* =========================================================
   GRID TO PIXEL
   ========================================================= */

function gridToPixel(x, y) {

    return {

        x:
            arenaLeft +
            x * cellSize,

        y:
            arenaTop +
            y * cellSize

    };

}


/* =========================================================
   OPPOSITE DIRECTION
   ========================================================= */

function isOpposite(a, b) {

    return (

        (a === "UP" &&
         b === "DOWN") ||

        (a === "DOWN" &&
         b === "UP") ||

        (a === "LEFT" &&
         b === "RIGHT") ||

        (a === "RIGHT" &&
         b === "LEFT")

    );

}


/* =========================================================
   PLAYER DIRECTION
   ========================================================= */

function changePlayerDirection(newDirection) {

    if (paused || gameOver) {
        return;
    }

    /*
        Never allow a direct 180° turn.
    */

    if (
        isOpposite(
            player.dir,
            newDirection
        )
    ) {
        return;
    }

    player.nextDir = newDirection;

}


/* =========================================================
   SWIPE CONTROLS
   ========================================================= */

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

const SWIPE_DISTANCE = 25;
const SWIPE_TIME = 700;


game.addEventListener(
    "pointerdown",
    function(event) {

        /*
            Ignore the pause button and pause menu.
        */

        if (
            event.target === pauseButton ||
            event.target.closest("#pauseMenu")
        ) {
            return;
        }

        touchStartX = event.clientX;
        touchStartY = event.clientY;

        touchStartTime =
            performance.now();

    }
);


game.addEventListener(
    "pointerup",
    function(event) {

        if (
            event.target === pauseButton ||
            event.target.closest("#pauseMenu")
        ) {
            return;
        }

        if (paused || gameOver) {
            return;
        }

        const dx =
            event.clientX -
            touchStartX;

        const dy =
            event.clientY -
            touchStartY;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const elapsed =
            performance.now() -
            touchStartTime;


        if (
            distance < SWIPE_DISTANCE
        ) {
            return;
        }

        if (
            elapsed > SWIPE_TIME
        ) {
            return;
        }


        /*
            Horizontal swipe.
        */

        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (dx > 0) {

                changePlayerDirection(
                    "RIGHT"
                );

            } else {

                changePlayerDirection(
                    "LEFT"
                );

            }

        }

        /*
            Vertical swipe.
        */

        else {

            if (dy > 0) {

                changePlayerDirection(
                    "DOWN"
                );

            } else {

                changePlayerDirection(
                    "UP"
                );

            }

        }

    }
);


/* =========================================================
   DOUBLE TAP = BLUE TRAIL
   ========================================================= */

let lastTap = 0;


game.addEventListener(
    "pointerup",
    function(event) {

        if (
            event.target === pauseButton ||
            event.target.closest("#pauseMenu")
        ) {
            return;
        }

        if (paused || gameOver) {
            return;
        }

        const now =
            performance.now();


        if (
            now - lastTap < 320
        ) {

            laserActive =
                !laserActive;

            player.trailEnabled =
                laserActive;

        }


        lastTap = now;

    }
);


/* =========================================================
   PAUSE BUTTON
   ========================================================= */

/*
    IMPORTANT:
    Stop the event from reaching the game swipe handlers.
*/

pauseButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

    }
);


pauseButton.addEventListener(
    "pointerup",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        togglePause();

    }
);


pauseButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

    }
);


/* =========================================================
   PAUSE
   ========================================================= */

function togglePause() {

    if (gameOver) {
        return;
    }

    paused = !paused;

    if (paused) {

        pauseMenu.style.display =
            "flex";

    } else {

        pauseMenu.style.display =
            "none";

        /*
            Prevent the stopwatch from
            jumping forward after unpausing.
        */

        lastTime =
            performance.now();

    }

}


/* =========================================================
   RESUME
   ========================================================= */

resumeButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        paused = false;

        pauseMenu.style.display =
            "none";

        lastTime =
            performance.now();

    }
);


/* =========================================================
   RESTART
   ========================================================= */

restartButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        resetGame();

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowUp" ||
            event.key.toLowerCase() === "w"
        ) {

            changePlayerDirection("UP");

        }


        if (
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ) {

            changePlayerDirection("DOWN");

        }


        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            changePlayerDirection("LEFT");

        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            changePlayerDirection("RIGHT");

        }


        if (
            event.key === " " ||
            event.key.toLowerCase() === "p"
        ) {

            togglePause();

        }


        if (
            event.key.toLowerCase() === "l"
        ) {

            laserActive =
                !laserActive;

            player.trailEnabled =
                laserActive;

        }

    }
);


/* =========================================================
   MOVE CYCLE
   ========================================================= */

function moveCycle(
    cycle,
    trail,
    dt,
    shouldLeaveTrail
) {

    cycle.dir =
        cycle.nextDir;

    const direction =
        DIRECTIONS[cycle.dir];


    cycle.x +=
        direction.x *
        cycle.speed *
        dt;

    cycle.y +=
        direction.y *
        cycle.speed *
        dt;


    /*
        Arena collision.
    */

    if (
        cycle.x < 0 ||
        cycle.x > GRID_SIZE ||
        cycle.y < 0 ||
        cycle.y > GRID_SIZE
    ) {

        if (cycle === player) {

            gameOver = true;

            showMessage(
                "CRASHED",
                "You hit the arena wall"
            );

        } else {

            gameOver = true;

            showMessage(
                "VICTORY",
                "The red cycle crashed"
            );

        }

        return;
    }


    /*
        Only record a trail if the cycle's
        light trail is currently ON.
    */

    if (shouldLeaveTrail) {

        if (
            trail.length === 0 ||
            distanceBetween(
                cycle.x,
                cycle.y,
                trail[
                    trail.length - 1
                ].x,
                trail[
                    trail.length - 1
                ].y
            ) > 0.08
        ) {

            trail.push({
                x: cycle.x,
                y: cycle.y
            });

        }

    }


    /*
        Keep memory under control.
    */

    if (trail.length > 2500) {

        trail.shift();

    }

}


/* =========================================================
   DISTANCE
   ========================================================= */

function distanceBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x1 - x2;

    const dy =
        y1 - y2;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   TRAIL COLLISION
   ========================================================= */

function checkTrailCollision(
    cycle,
    trail
) {

    const checkDistance =
        0.35;


    for (
        let i = 0;
        i < trail.length - 5;
        i++
    ) {

        const point =
            trail[i];


        if (
            Math.abs(
                cycle.x - point.x
            ) < checkDistance &&

            Math.abs(
                cycle.y - point.y
            ) < checkDistance
        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   CYCLE COLLISION
   ========================================================= */

function checkCycleCollision() {

    return (
        distanceBetween(
            player.x,
            player.y,
            enemy.x,
            enemy.y
        ) < 0.75
    );

}


/* =========================================================
   ENEMY AI
   ========================================================= */

function updateEnemyAI() {

    const possibleDirections = [
        "UP",
        "DOWN",
        "LEFT",
        "RIGHT"
    ];


    const safeDirections =
        possibleDirections.filter(
            function(dir) {

                if (
                    isOpposite(
                        enemy.dir,
                        dir
                    )
                ) {
                    return false;
                }


                const direction =
                    DIRECTIONS[dir];


                const testX =
                    enemy.x +
                    direction.x *
                    1.5;

                const testY =
                    enemy.y +
                    direction.y *
                    1.5;


                if (
                    testX < 0.5 ||
                    testX >
                    GRID_SIZE - 0.5 ||

                    testY < 0.5 ||
                    testY >
                    GRID_SIZE - 0.5
                ) {
                    return false;
                }


                /*
                    Avoid the red trail.
                */

                if (
                    checkPointAgainstTrail(
                        testX,
                        testY,
                        enemyTrail
                    )
                ) {
                    return false;
                }


                /*
                    Avoid the blue trail.
                */

                if (
                    checkPointAgainstTrail(
                        testX,
                        testY,
                        playerTrail
                    )
                ) {
                    return false;
                }


                return true;

            }
        );


    if (
        safeDirections.length === 0
    ) {
        return;
    }


    const currentDirection =
        enemy.dir;


    if (
        safeDirections.includes(
            currentDirection
        )
    ) {

        if (
            Math.random() < 0.025
        ) {

            const turns =
                safeDirections.filter(
                    function(d) {
                        return (
                            d !==
                            currentDirection
                        );
                    }
                );


            if (
                turns.length > 0
            ) {

                enemy.nextDir =
                    turns[
                        Math.floor(
                            Math.random() *
                            turns.length
                        )
                    ];

            }

        }

    } else {

        enemy.nextDir =
            safeDirections[
                Math.floor(
                    Math.random() *
                    safeDirections.length
                )
            ];

    }

}


/* =========================================================
   TRAIL POINT CHECK
   ========================================================= */

function checkPointAgainstTrail(
    x,
    y,
    trail
) {

    const checkDistance =
        0.42;


    for (
        let i = 0;
        i < trail.length;
        i++
    ) {

        const point =
            trail[i];


        if (
            Math.abs(
                x - point.x
            ) < checkDistance &&

            Math.abs(
                y - point.y
            ) < checkDistance
        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   RANDOM RED TRAIL
   ========================================================= */

function updateEnemyTrail(dt) {

    enemyTrailTimer += dt;


    if (
        enemyTrailTimer >=
        enemyTrailNextChange
    ) {

        enemyTrailTimer = 0;

        enemyTrailActive =
            !enemyTrailActive;


        enemyTrailNextChange =
            randomEnemyTrailTime();

    }

}


/* =========================================================
   UPDATE
   ========================================================= */

function update(dt) {

    if (
        paused ||
        gameOver
    ) {
        return;
    }


    /*
        Stopwatch.
    */

    survivalTime += dt;


    /*
        Random red trail.
    */

    updateEnemyTrail(dt);


    /*
        Enemy AI.
    */

    updateEnemyAI();


    /*
        Player movement.

        The player's trail only gets recorded
        when double-tap laser is active.
    */

    moveCycle(
        player,
        playerTrail,
        dt,
        player.trailEnabled
    );


    /*
        Enemy movement.

        The red trail is controlled randomly.
    */

    moveCycle(
        enemy,
        enemyTrail,
        dt,
        enemyTrailActive
    );


    if (gameOver) {
        return;
    }


    /*
        Blue player trail hits red cycle.
    */

    if (
        player.trailEnabled &&
        checkTrailCollision(
            enemy,
            playerTrail
        )
    ) {

        gameOver = true;

        showMessage(
            "VICTORY",
            "The red cycle hit your blue trail"
        );

        return;

    }


    /*
        Red trail hits player.
    */

    if (
        enemyTrailActive &&
        checkTrailCollision(
            player,
            enemyTrail
        )
    ) {

        gameOver = true;

        showMessage(
            "CRASHED",
            "You hit the red light trail"
        );

        return;

    }


    /*
        Cycle-to-cycle collision.
    */

    if (
        checkCycleCollision()
    ) {

        gameOver = true;

        showMessage(
            "CRASH",
            "The cycles collided"
        );

    }

}


/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBackground() {

    const gradient =
        ctx.createRadialGradient(
            width / 2,
            height / 2,
            20,
            width / 2,
            height / 2,
            Math.max(
                width,
                height
            ) * 0.7
        );


    gradient.addColorStop(
        0,
        "#041d3a"
    );

    gradient.addColorStop(
        0.5,
        "#020d24"
    );

    gradient.addColorStop(
        1,
        "#01030b"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
        Blue neon atmosphere.
    */

    ctx.save();

    ctx.globalAlpha = 0.18;


    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const x =
            (
                i * 173 +
                performance.now() *
                0.012
            ) % width;


        const y =
            (
                i * 97
            ) % height;


        const radius =
            80 +
            (i % 4) * 35;


        const glow =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                radius
            );


        glow.addColorStop(
            0,
            "rgba(0,150,255,0.5)"
        );

        glow.addColorStop(
            1,
            "rgba(0,50,255,0)"
        );


        ctx.fillStyle =
            glow;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.restore();

}


/* =========================================================
   ARENA
   ========================================================= */

function drawArena() {

    ctx.save();


    /*
        Outer neon glow.
    */

    ctx.shadowBlur = 25;

    ctx.shadowColor =
        "rgba(0,130,255,0.8)";


    ctx.strokeStyle =
        "#087cff";

    ctx.lineWidth = 3;


    ctx.strokeRect(
        arenaLeft,
        arenaTop,
        arenaSize,
        arenaSize
    );


    ctx.shadowBlur = 0;


    /*
        Black arena surface.
    */

    ctx.fillStyle =
        "rgba(0,3,10,0.78)";


    ctx.fillRect(
        arenaLeft,
        arenaTop,
        arenaSize,
        arenaSize
    );


    /*
        Vertical grid.
    */

    for (
        let i = 0;
        i <= GRID_SIZE;
        i++
    ) {

        const position =
            arenaLeft +
            i * cellSize;


        ctx.beginPath();

        ctx.moveTo(
            position,
            arenaTop
        );

        ctx.lineTo(
            position,
            arenaTop +
            arenaSize
        );


        ctx.strokeStyle =
            i === 0 ||
            i === GRID_SIZE

                ? "rgba(0,170,255,0.7)"

                : "rgba(0,100,190,0.25)";


        ctx.lineWidth =
            i === 0 ||
            i === GRID_SIZE

                ? 2

                : 1;


        ctx.stroke();

    }


    /*
        Horizontal grid.
    */

    for (
        let i = 0;
        i <= GRID_SIZE;
        i++
    ) {

        const position =
            arenaTop +
            i * cellSize;


        ctx.beginPath();

        ctx.moveTo(
            arenaLeft,
            position
        );

        ctx.lineTo(
            arenaLeft +
            arenaSize,
            position
        );


        ctx.strokeStyle =
            i === 0 ||
            i === GRID_SIZE

                ? "rgba(0,170,255,0.7)"

                : "rgba(0,100,190,0.25)";


        ctx.lineWidth =
            i === 0 ||
            i === GRID_SIZE

                ? 2

                : 1;


        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   TRAIL
   ========================================================= */

function drawTrail(
    trail,
    color
) {

    if (
        trail.length < 2
    ) {
        return;
    }


    ctx.save();

    ctx.lineJoin =
        "round";

    ctx.lineCap =
        "round";


    /*
        Outer glow.
    */

    ctx.beginPath();


    for (
        let i = 0;
        i < trail.length;
        i++
    ) {

        const point =
            gridToPixel(
                trail[i].x,
                trail[i].y
            );


        if (i === 0) {

            ctx.moveTo(
                point.x,
                point.y
            );

        } else {

            ctx.lineTo(
                point.x,
                point.y
            );

        }

    }


    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        TRAIL_WIDTH + 10;

    ctx.globalAlpha =
        0.22;

    ctx.shadowBlur =
        25;

    ctx.shadowColor =
        color;

    ctx.stroke();


    /*
        Main trail.
    */

    ctx.beginPath();


    for (
        let i = 0;
        i < trail.length;
        i++
    ) {

        const point =
            gridToPixel(
                trail[i].x,
                trail[i].y
            );


        if (i === 0) {

            ctx.moveTo(
                point.x,
                point.y
            );

        } else {

            ctx.lineTo(
                point.x,
                point.y
            );

        }

    }


    ctx.globalAlpha =
        0.9;

    ctx.shadowBlur =
        12;

    ctx.shadowColor =
        color;

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        TRAIL_WIDTH;

    ctx.stroke();


    /*
        White center.
    */

    ctx.globalAlpha =
        0.9;

    ctx.shadowBlur =
        5;

    ctx.shadowColor =
        "#ffffff";

    ctx.strokeStyle =
        "#dff8ff";

    ctx.lineWidth =
        1.5;

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   CYCLE
   ========================================================= */

function drawCycle(cycle) {

    const center =
        gridToPixel(
            cycle.x,
            cycle.y
        );


    const length =
        cellSize * 0.92;


    const thickness =
        Math.max(
            7,
            cellSize * 0.25
        );


    let angle = 0;


    if (
        cycle.dir === "UP"
    ) {

        angle =
            -Math.PI / 2;

    }


    if (
        cycle.dir === "DOWN"
    ) {

        angle =
            Math.PI / 2;

    }


    if (
        cycle.dir === "LEFT"
    ) {

        angle =
            Math.PI;

    }


    if (
        cycle.dir === "RIGHT"
    ) {

        angle = 0;

    }


    ctx.save();


    ctx.translate(
        center.x,
        center.y
    );

    ctx.rotate(angle);


    /*
        Neon outer body.
    */

    ctx.shadowBlur =
        24;

    ctx.shadowColor =
        cycle.color;

    ctx.fillStyle =
        cycle.color;


    ctx.beginPath();

    ctx.roundRect(
        -length / 2,
        -thickness / 2,
        length,
        thickness,
        thickness / 2
    );

    ctx.fill();


    /*
        Black center.
    */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#02040a";


    ctx.beginPath();

    ctx.roundRect(
        -length / 2 + 3,
        -thickness / 2 + 2,
        length - 6,
        thickness - 4,
        thickness / 2
    );

    ctx.fill();


    /*
        Bright center line.
    */

    ctx.fillStyle =
        cycle.core;

    ctx.shadowBlur =
        10;

    ctx.shadowColor =
        cycle.color;


    ctx.beginPath();

    ctx.roundRect(
        -length / 2 + 4,
        -1,
        length - 8,
        2,
        1
    );

    ctx.fill();


    /*
        Front light.
    */

    ctx.fillStyle =
        cycle.color;

    ctx.shadowBlur =
        18;


    ctx.beginPath();

    ctx.arc(
        length / 2 - 2,
        0,
        thickness * 0.28,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   FORMAT STOPWATCH
   ========================================================= */

function formatTime(seconds) {

    const totalMilliseconds =
        Math.floor(
            seconds * 1000
        );


    const minutes =
        Math.floor(
            totalMilliseconds /
            60000
        );


    const remainingAfterMinutes =
        totalMilliseconds %
        60000;


    const secs =
        Math.floor(
            remainingAfterMinutes /
            1000
        );


    const milliseconds =
        Math.floor(
            (
                remainingAfterMinutes %
                1000
            ) / 10
        );


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0") +
        "." +
        String(milliseconds).padStart(2, "0")
    );

}


/* =========================================================
   HUD
   ========================================================= */

function drawHUD() {

    ctx.save();


    /*
        Stopwatch box.
    */

    const timerText =
        formatTime(
            survivalTime
        );


    const timerX =
        width / 2;

    const timerY =
        25;


    ctx.font =
        "bold 17px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    /*
        Stopwatch background.
    */

    const boxWidth = 112;
    const boxHeight = 34;


    ctx.fillStyle =
        "rgba(0,8,22,0.82)";


    ctx.strokeStyle =
        "rgba(70,190,255,0.65)";


    ctx.lineWidth = 1;


    ctx.beginPath();

    ctx.roundRect(
        timerX - boxWidth / 2,
        timerY,
        boxWidth,
        boxHeight,
        8
    );

    ctx.fill();
    ctx.stroke();


    /*
        Stopwatch text.
    */

    ctx.fillStyle =
        "#8de4ff";

    ctx.shadowBlur =
        10;

    ctx.shadowColor =
        "#229dff";


    ctx.fillText(
        timerText,
        timerX,
        timerY +
        boxHeight / 2
    );


    /*
        Grid label.
    */

    ctx.shadowBlur = 0;

    ctx.textAlign =
        "left";

    ctx.font =
        "bold 12px Arial";

    ctx.fillStyle =
        "rgba(150,220,255,0.8)";


    ctx.fillText(
        "25 × 25",
        arenaLeft,
        arenaTop - 12
    );


    /*
        Blue laser indicator.
    */

    if (
        laserActive
    ) {

        ctx.textAlign =
            "right";

        ctx.fillStyle =
            "#67dfff";

        ctx.shadowBlur =
            10;

        ctx.shadowColor =
            "#39caff";


        ctx.fillText(
            "LASER ACTIVE",
            arenaLeft +
            arenaSize,
            arenaTop - 12
        );

    }


    /*
        Red trail status.

        This is deliberately subtle so it
        doesn't clutter the game.
    */

    ctx.textAlign =
        "left";

    ctx.font =
        "bold 10px Arial";


    if (
        enemyTrailActive
    ) {

        ctx.fillStyle =
            "rgba(255,70,90,0.7)";

        ctx.fillText(
            "RED TRAIL ON",
            arenaLeft,
            arenaTop +
            arenaSize +
            18
        );

    } else {

        ctx.fillStyle =
            "rgba(255,70,90,0.35)";

        ctx.fillText(
            "RED TRAIL OFF",
            arenaLeft,
            arenaTop +
            arenaSize +
            18
        );

    }


    ctx.restore();

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
    title,
    text
) {

    messageTitle.textContent =
        title;

    messageText.textContent =
        text;

    message.style.opacity =
        "1";

}


function hideMessage() {

    message.style.opacity =
        "0";

}


/* =========================================================
   DRAW
   ========================================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawBackground();

    drawArena();


    /*
        RED TRAIL

        It is only drawn when the red
        cycle's random trail is active.
    */

    if (
        enemyTrailActive
    ) {

        drawTrail(
            enemyTrail,
            ENEMY_COLOR
        );

    }


    /*
        BLUE PLAYER TRAIL
    */

    if (
        player.trailEnabled
    ) {

        drawTrail(
            playerTrail,
            PLAYER_COLOR
        );

    }


    /*
        Cycles.
    */

    drawCycle(enemy);

    drawCycle(player);


    /*
        HUD / stopwatch.
    */

    drawHUD();

}


/* =========================================================
   MAIN LOOP
   ========================================================= */

function loop(time) {

    const dt =
        Math.min(
            (time - lastTime) / 1000,
            0.04
        );


    lastTime =
        time;


    update(dt);

    draw();


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   START GAME
   ========================================================= */

resize();

resetGame();

requestAnimationFrame(
    loop
);

</script>
